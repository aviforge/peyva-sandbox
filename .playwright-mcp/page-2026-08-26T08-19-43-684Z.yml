          - generic [ref=e119]: Test it
        - list [ref=e120]:
          - listitem [ref=e121]: "This is the simplest way a system can fail: turn it off."
        - list [ref=e122]:
          - listitem [ref=e123]: "Run it with `go run .`. Confirm it prints the account's starting balance."
          - listitem [ref=e124]: Stop it with Ctrl+C, run it again. The balance resets to the hardcoded value.
          - listitem [ref=e125]: "Nothing survived, and today that is expected: the balance only ever lived in memory, and memory goes when the process does."
