        - paragraph [ref=e108]:
          - generic [ref=e109]: Zero-shot prompting
          - text: ". No examples, no reasoning scaffold, no role: just the instruction. The task has one obvious shape, so scaffolding would cost tokens and buy nothing. Every technique after this is a departure from this baseline, which is why it comes first."
        - paragraph [ref=e110]: "Documented in The Prompt Report: Zero-Shot"
