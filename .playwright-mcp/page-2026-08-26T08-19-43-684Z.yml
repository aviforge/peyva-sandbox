        - list [ref=e79]:
          - listitem [ref=e80]: Alice opens her wallet, picks Bob, types $20, and hits send. Seconds later, Bob has it.
          - listitem [ref=e81]: That's the whole system, from the outside.
          - listitem [ref=e82]: "Every chapter answers one question about that moment: how the request arrives, what the program does with it, what could go wrong."
      - generic [ref=e83]:
        - heading "2. Concepts" [level=2] [ref=e84]
        - list [ref=e85]:
          - listitem [ref=e86]:
            - strong [ref=e87]: User
            - text: . A person with an identity in the system. Owns exactly one account.
          - listitem [ref=e88]:
            - strong [ref=e89]: Account
            - text: . One owner and an amount, the thing this book protects.
          - listitem [ref=e90]:
            - strong [ref=e91]: Balance
            - text: . How much an account holds. Must never go negative, be lost, or be double-spent.
          - listitem [ref=e92]:
            - strong [ref=e93]: Vault
            - text: . The component holding every account and what's in it. Nothing else is allowed to change a balance.
          - listitem [ref=e94]:
            - strong [ref=e95]: Transfer
            - text: . A request to move money between accounts, the core action of this book.
          - listitem [ref=e96]:
            - strong [ref=e97]: History
            - text: . The record of every transfer. If the balance is the answer, history is the proof.
